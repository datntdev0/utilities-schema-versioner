name: Publish NuGet Package

on:
  workflow_call:
    inputs:
      version:
        description: 'Package version (default: from auto_cd)'
        required: true
        type: string
      prerelease:
        description: 'Publish as prerelease with version suffix'
        required: false
        type: boolean
        default: true
      publish:
        description: 'Push package to NuGet'
        required: false
        type: boolean
        default: false

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Pack NuGet package (prerelease)
        if: ${{ inputs.prerelease }}
        run: |
          VERSION_SUFFIX="-prerelease.$(date +'%Y%m%d')"
          echo Building package with suffix version: ${{ inputs.version }}$VERSION_SUFFIX
          dotnet pack src/datntdev.SchemaVersioner/datntdev.SchemaVersioner.csproj \
          --configuration Release --output ./nupkg /p:PackageVersion=${{ inputs.version }}$VERSION_SUFFIX

      - name: Pack NuGet package (versioned)
        if: ${{ inputs.version && !inputs.prerelease }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            dotnet pack src/datntdev.SchemaVersioner/datntdev.SchemaVersioner.csproj \
            --configuration Release --output ./nupkg /p:PackageVersion=${{ inputs.version }}
          fi

      - name: Upload NuGet package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: datntdev.SchemaVersioner(packages)
          path: ./nupkg/*.nupkg

      - name: Publish to NuGet
        if: ${{ inputs.publish }}
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
          --source https://api.nuget.org/v3/index.json --skip-duplicate \
          --api-key ${{ secrets.NUGET_API_KEY }}
