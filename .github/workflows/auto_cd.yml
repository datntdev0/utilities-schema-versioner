name: Automatic CD Pipeline

on:
  push:
    branches: [ "main", "release" ]
  create:
    tags:
      - '*'

jobs:

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Pull database images for unit tests
        run: |
          docker pull mcr.microsoft.com/mssql/server:latest
          docker pull postgres:latest

      - name: Install ReportGenerator
        if: ${{ inputs.coverage }}
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Run tests
        if: ${{ !inputs.coverage }}
        run: dotnet test --no-build --configuration Release

      - name: Run tests with coverage
        if: ${{ inputs.coverage }}
        run: |
          dotnet test --no-build --configuration Release \
          --logger trx --results-directory ./TestResults --collect:"XPlat Code Coverage" \
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByAttribute=*.Tests*

      - name: Generate coverage report (exclude test projects)
        if: ${{ inputs.coverage }}
        run: |
          reportgenerator \
          -reports:TestResults/**/coverage.cobertura.xml \
          -targetdir:CoverageReport \
          -reporttypes:TextSummary \
          -assemblyfilters:"-*.Tests*"
          cat CoverageReport/Summary.txt

  build-cli-app:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build CLI tool for net9.0 (Windows .exe)
        run: |
          dotnet build src/datntdev.SchemaVersioner.Cli/datntdev.SchemaVersioner.Cli.csproj \
          --configuration Release --framework net9.0 --runtime win-x64
      
      - name: Publish CLI tool for net9.0 (Windows .exe)
        run: |
          dotnet publish src/datntdev.SchemaVersioner.Cli/datntdev.SchemaVersioner.Cli.csproj --no-restore \
          --configuration Release --framework net9.0 --runtime win-x64 \
          --output ./bin/cli/net9.0-win-x64 --self-contained false

      - name: Upload CLI tool as artifact
        uses: actions/upload-artifact@v4
        with:
          name: datntdev.SchemaVersioner.Cli(x64)
          path: ./bin/cli/net9.0-win-x64

  publish-packages:
    needs: unit-tests
    uses: ./.github/workflows/sub_publish_nuget.yml
    with:
      publish: true
      version: ${{ github.event_name == 'create' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    secrets: inherit